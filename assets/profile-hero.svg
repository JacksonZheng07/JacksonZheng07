<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Jackson Zheng — software engineer</title>
  <desc id="desc">A dark developer-console inspired profile banner with a glowing systems diagram.</desc>
