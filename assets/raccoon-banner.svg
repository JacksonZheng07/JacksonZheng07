    <path d="M261 145c-32-26-58-30-86-14 11 17 22 33 42 44 19 10 41 6 57-4-2-10-6-18-13-26z" fill="#111722"/>
    <ellipse cx="129" cy="148" rx="16" ry="19" fill="#EAF0F8"/><ellipse cx="221" cy="148" rx="16" ry="19" fill="#EAF0F8"/>
    <circle cx="132" cy="151" r="8" fill="#151C28"/><circle cx="218" cy="151" r="8" fill="#151C28"/>
    <circle cx="135" cy="147" r="2.5" fill="#77E1C1"/><circle cx="215" cy="147" r="2.5" fill="#77E1C1"/>

    <!-- muzzle -->
    <path d="M126 181c15-14 32-21 49-21s34 7 49 21c-1 39-20 70-49 70s-48-31-49-70z" fill="#D9DEE7"/>
    <path d="M154 183c5-8 12-12 21-12s16 4 21 12c-4 13-11 19-21 19s-17-6-21-19z" fill="#161C26"/>
    <path d="M175 201v15M175 216c-10 0-16 5-19 11M175 216c10 0 16 5 19 11" fill="none" stroke="#667185" stroke-width="3" stroke-linecap="round"/>

    <!-- laptop -->
    <path d="M75 252h200l-15 76H90z" fill="#202A3A" stroke="#7DA8FF" stroke-opacity=".45" stroke-width="2"/>
    <path d="M61 328h228l-13 16H74z" fill="#354155"/>
    <circle cx="175" cy="291" r="14" fill="none" stroke="url(#mint)" stroke-width="3"/>
    <path d="M169 291l5 5 9-11" fill="none" stroke="#77E1C1" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
