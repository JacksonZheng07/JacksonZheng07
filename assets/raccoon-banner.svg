    <path d="M68 126L74 55l64 52z" fill="#758197"/><path d="M282 126l-7-71-63 52z" fill="#758197"/>
    <path d="M82 104l2-28 27 23zM268 104l-3-28-27 23z" fill="#293344"/>

    <!-- head -->
    <path d="M69 130c13-52 53-79 106-79s93 27 106 79c10 43-3 116-47 150-19 15-40 24-59 24s-40-9-59-24c-44-34-57-107-47-150z" fill="#8792A5"/>
    <path d="M83 139c28-35 60-47 92-47s64 12 92 47c-17 10-29 22-37 39-17-10-35-15-55-15s-38 5-55 15c-8-17-20-29-37-39z" fill="#273142"/>

