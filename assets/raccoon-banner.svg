<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="390" viewBox="0 0 1200 390" role="img" aria-labelledby="title desc">
  <title id="title">Jackson Zheng — building after dark</title>
  <desc id="desc">A moonlit developer profile banner featuring a geometric raccoon mascot.</desc>
  <defs>
    <linearGradient id="night" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#090C14"/><stop offset=".55" stop-color="#111827"/><stop offset="1" stop-color="#172033"/>
    </linearGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFF2B2"/><stop offset="1" stop-color="#F2B84B"/>
    </linearGradient>
    <linearGradient id="mint" x1="0" y1="0" x2="1" y2="0">
      <stop stop-color="#77E1C1"/><stop offset="1" stop-color="#7DA8FF"/>
    </linearGradient>
    <radialGradient id="halo"><stop stop-color="#FFD76A" stop-opacity=".16"/><stop offset="1" stop-color="#FFD76A" stop-opacity="0"/></radialGradient>
    <pattern id="dots" width="30" height="30" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#DCE7FF" fill-opacity=".06"/></pattern>
    <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  </defs>

  <rect width="1200" height="390" rx="28" fill="url(#night)"/>
  <rect width="1200" height="390" rx="28" fill="url(#dots)"/>
  <rect x="28" y="28" width="1144" height="334" rx="20" fill="none" stroke="#B7C4DD" stroke-opacity=".13"/>

  <g fill="#91A0BA">
    <circle cx="755" cy="73" r="2"/><circle cx="812" cy="48" r="1.5"/><circle cx="1090" cy="74" r="2"/><circle cx="1130" cy="153" r="1.5"/><circle cx="707" cy="151" r="1.5"/>
    <path d="M746 110h14M753 103v14M1090 120h12M1096 114v12" stroke="#91A0BA" stroke-width="1.5" fill="none" opacity=".6"/>
  </g>

  <text x="74" y="86" fill="#7889A6" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="14">~/the-den/profile.md</text>
  <text x="72" y="156" fill="#F6F8FC" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="60" font-weight="750" letter-spacing="-2">Jackson Zheng</text>
  <rect x="74" y="178" width="96" height="4" rx="2" fill="url(#mint)"/>
  <text x="74" y="224" fill="#C1CCE0" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22">Second-year CS + Math @ Northeastern</text>
  <text x="74" y="258" fill="#9FADC5" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="19">ML · data automation · systems · infrastructure</text>

  <g transform="translate(74 296)" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13">
    <rect width="138" height="34" rx="17" fill="#111C2C" stroke="#77E1C1" stroke-opacity=".45"/><circle cx="18" cy="17" r="4" fill="#77E1C1"/><text x="31" y="22" fill="#B9C7DB">BUILDING NOW</text>
    <rect x="150" width="154" height="34" rx="17" fill="#111C2C" stroke="#7DA8FF" stroke-opacity=".45"/><text x="171" y="22" fill="#B9C7DB">AFTER DARK ☾</text>
  </g>

  <g transform="translate(820 30)">
    <circle cx="162" cy="164" r="154" fill="url(#halo)" filter="url(#blur)"/>
    <circle cx="175" cy="142" r="112" fill="url(#moon)"/>
    <circle cx="205" cy="117" r="103" fill="#131C2C"/>

